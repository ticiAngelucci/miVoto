version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mivoto-backend:dev
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      # 1. Cambia el VALOR para que coincida con Render
      GOOGLE_APPLICATION_CREDENTIALS: /etc/secrets/service-account.json
    volumes:
      # 2. Cambia la RUTA de montaje para que coincida con Render
      - ./secrets/service-account.json:/etc/secrets/service-account.json:ro
    ports:
      - "8080:8080"
      